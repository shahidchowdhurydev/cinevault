<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CineVault — Discover Movies</title>

  <!-- Google Fonts: Syne (headings) + DM Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-inner">

      <!-- Logo -->
      <a href="#" class="logo" id="homeBtn">
        <i class="fa-solid fa-clapperboard logo-icon"></i>
        <span>Cine<span class="logo-accent">Vault</span></span>
      </a>

      <!-- Search Box -->
      <form class="search-form" id="searchForm">
        <div class="search-wrap">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Search movies, genres…"
            autocomplete="off"
          />
          <button type="submit" class="search-btn">Search</button>
        </div>
      </form>

    </div>
  </header>

  <!-- ===== HERO SECTION ===== -->
  <section class="hero" id="heroSection">
    <div class="hero-content">
      <p class="hero-tag"><i class="fa-solid fa-fire"></i> Trending Now</p>
      <h1 class="hero-title">Discover<br/><span class="hero-accent">Blockbusters</span></h1>
      <p class="hero-sub">Search millions of movies. Explore ratings, genres & more.</p>
    </div>
    <div class="hero-glow"></div>
  </section>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="container">

    <!-- Section heading (changes dynamically) -->
    <div class="section-header">
      <h2 class="section-title" id="sectionTitle">
        <i class="fa-solid fa-star"></i> Popular Movies
      </h2>
      <span class="result-count" id="resultCount"></span>
    </div>

    <!-- Filter / Sort bar -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="popular">🔥 Popular</button>
      <button class="filter-btn" data-filter="top_rated">⭐ Top Rated</button>
      <button class="filter-btn" data-filter="upcoming">🎬 Upcoming</button>
      <button class="filter-btn" data-filter="now_playing">🍿 Now Playing</button>
    </div>

    <!-- Loading Spinner -->
    <div class="spinner-wrap" id="spinner">
      <div class="spinner"></div>
      <p>Loading movies…</p>
    </div>

    <!-- Error Message -->
    <div class="error-box" id="errorBox" style="display:none;">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <p id="errorMsg">Something went wrong. Please try again.</p>
    </div>

    <!-- Movie Grid -->
    <div class="movies-grid" id="moviesGrid"></div>

    <!-- Load More Button -->
    <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
      <button class="load-more-btn" id="loadMoreBtn">
        <i class="fa-solid fa-circle-chevron-down"></i> Load More
      </button>
    </div>

  </main>

  <!-- ===== MOVIE DETAIL MODAL ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="movieModal">
      <button class="modal-close" id="modalClose">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="modal-inner" id="modalInner">
        <!-- Filled dynamically by JS -->
      </div>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <p>
      Built with ❤️ by
      <a href="https://github.com/shahidchowdhurydev" target="_blank">Md. Shahid Chowdhury</a>
      · Data from
      <a href="https://www.themoviedb.org" target="_blank">TMDB</a>
    </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
